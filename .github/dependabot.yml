version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # react, react-dom and their @types peer each other; split PRs fail
      # `npm ci` with ERESOLVE, so they have to arrive as one.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # Every devDependency is bumped as one grouped PR, so a single
      # unsatisfiable version sinks the whole group at `npm ci`.
      #
      # typescript-eslint 8.65.0 (currently the latest; there is no 9.x) peers
      # typescript ">=4.8.4 <6.1.0". Dependabot proposing typescript 7 therefore
      # deadlocks the group with ERESOLVE before lint/typecheck/build ever run,
      # blocking ~20 unrelated dev-dependency bumps. Verified: TS 7 + plugin
      # 8.65 fails to resolve, TS 5.x + plugin 8.65 resolves cleanly.
      #
      # REMOVE THIS once typescript-eslint's peer range covers typescript 7:
      #   npm view @typescript-eslint/parser peerDependencies.typescript
      # Until then TypeScript stays on 5.x and major bumps are not proposed.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Phaser 4 was tried on 2026-11-10 and deferred. It typechecks and the
      # menu and a run render, but GeometryMask is Canvas-only in v4, so the
      # Hangar list mask (HangarScene.ts, createGeometryMask) needs a rewrite
      # to the filter mask API, and the 8,800-line GameScene needs a full
      # playthrough before it can ship. Remove this entry to try again.
      - dependency-name: "phaser"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
