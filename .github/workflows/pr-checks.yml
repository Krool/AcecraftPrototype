# PR validation - the same gates itch.yml runs before publishing, minus the
# publish. Exists so PRs (dependabot included) have a real check to judge by.
name: PR Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Guards the music-streaming fix; see tools/README.md
      - run: npm run check:audio
      - run: npm run build
