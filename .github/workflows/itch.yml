# Publish Roguecraft to itch.io (https://krool.itch.io/roguecraft) via butler.
#
# Mirrors itch on every deploy: runs on push to master (like Pages) plus a manual Run-workflow option.
# Gated on the BUTLER_API_KEY repo secret, so if that secret is ever removed the job no-ops and can
# NEVER publish. Builds with a RELATIVE asset base (--base=./) because itch serves the game from an
# iframe subpath; the committed vite base is '/AcecraftPrototype/' (absolute, for GitHub Pages) and
# would 404 every asset on itch. --if-changed skips the push when the build is byte-identical to the
# current itch build, so untouched commits don't create empty itch versions.
name: Publish to itch.io

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  itch:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - if: env.BUTLER_API_KEY == ''
        run: echo "::notice::BUTLER_API_KEY not set — itch publish skipped. Add the secret to enable."
      - uses: actions/setup-node@v7
        if: env.BUTLER_API_KEY != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.BUTLER_API_KEY != ''
        run: npm ci
      - name: Lint
        if: env.BUTLER_API_KEY != ''
        run: npm run lint
      - name: Typecheck
        if: env.BUTLER_API_KEY != ''
        run: npm run typecheck
      - name: Build with relative base (itch serves from an iframe subpath)
        if: env.BUTLER_API_KEY != ''
        run: npm run build -- --base=./
      - name: Push to itch.io (butler pinned + hash-verified)
        if: env.BUTLER_API_KEY != ''
        env:
          # Pinned + verified: butler runs with BUTLER_API_KEY in env, so an
          # unpinned LATEST download is a supply-chain injection point. To bump:
          # download the new zip, sha256sum it, update both values.
          BUTLER_VERSION: "15.21.0"
          BUTLER_SHA256: "b640fceade5cafc7601b0ee57ba13c85913917eb5440375f7a605126f9ca2e1c"
        run: |
          curl -sL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  butler.zip" | sha256sum -c -
          unzip -q butler.zip
          chmod +x butler
          ./butler push dist krool/roguecraft:html5 --userversion "${{ github.sha }}" --if-changed
